[project]
name = "legal-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dotmd>=0.1.2",
    "langchain-experimental>=0.4.2",
    "ollama>=0.6.2",
    "playwright>=1.62.0",
    "selenium>=4.49.0",
    "trafilatura>=2.2.0",
    "transformers>=5.17.0",
    "webdriver-manager>=4.1.2",
    "torch",
    "torchvision",
    "torchaudio",
    "sentence-transformers>=6.0.1",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
